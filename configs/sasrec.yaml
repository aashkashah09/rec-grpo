# RecBole config for the SASRec baseline. The atomic files are written by
# scripts/00_prepare_data.py from the same interaction table and the same
# global temporal split the generative model uses, so the two are scored on
# identical test targets.

data_path: data/recbole
dataset: beauty

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]

MAX_ITEM_LIST_LENGTH: 50
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list

eval_args:
  split: {RS: [0.8, 0.1, 0.1]}
  group_by: ~                 # global split, not per-user
  order: TO
  mode: full                  # full-catalog ranking, no sampled negatives

# tuned on validation, see results/sasrec_tuning.csv
hidden_size: 128
inner_size: 256
n_layers: 2
n_heads: 2
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE

epochs: 300
train_batch_size: 256
eval_batch_size: 4096
learning_rate: 0.001
stopping_step: 20
metrics: [Recall, NDCG]
topk: [5, 10, 20]
valid_metric: NDCG@10
seed: 42
