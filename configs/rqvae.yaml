processed_dir: data/processed
out_dir: data/processed
checkpoint_dir: checkpoints/rqvae

encoder:
  model_name: sentence-transformers/sentence-t5-base
  batch_size: 128
  normalize: false            # RQ-VAE reconstructs raw encoder space
  cache: data/processed/item_text_emb.npy

rqvae:
  input_dim: 768
  hidden_dims: [512, 256, 128]
  latent_dim: 32
  n_levels: 3
  codebook_size: 256
  commitment_weight: 0.25
  kmeans_init: true
  kmeans_iters: 50
  dead_code_threshold: 1      # codes unused for a full epoch get re-seeded
  dropout: 0.0

train:
  steps: 20000
  batch_size: 1024
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 500
  grad_clip: 1.0
  log_every: 100
  seed: 42

# Items whose three learned codes collide get a deterministic suffix token so
# that every item has a unique sequence. The suffix range is sized to the
# codebook so the vocabulary layout stays uniform.
dedup_capacity: 256
