# Small, fast environment profile for development, CI, and integration tests.
# Same schema as env.yaml; only the scale (row/task counts) differs.
schema_version: 1
seed: 20260711

db:
  n_customers: 120
  n_products: 40
  n_orders: 1500
  date_start: "2022-01-01"
  date_end: "2024-12-31"
  segments: [consumer, smb, enterprise]
  countries: [US, CA, GB, DE, FR, AU, JP, BR]
  channels: [web, mobile, partner]
  marketing_channels: [organic, paid_search, social, referral, email]
  categories: [apparel, electronics, home, beauty, toys, grocery, sports, books]
  price_cents_min: 500
  price_cents_max: 50000
  cost_fraction: 0.6
  max_items_per_order: 5
  max_quantity: 4
  cancel_prob: 0.08
  pending_prob: 0.05
  refund_prob: 0.06
  return_prob: 0.05
  discount_prob: 0.40
  null_discount_prob: 0.30

tasks:
  n_tasks: 80
  templates:
    - revenue_by_segment
    - refund_rate_cohort
    - topk_categories
    - mom_growth
    - customer_ltv
    - return_rate_anomaly
    - category_order_ratio
    - null_discount_edge
  k_choices: [2, 3, 5]
  min_units_choices: [3, 5, 10]

tools:
  run_sql:
    max_rows: 1000
    max_ops: 20000000
  python_calc:
    max_nodes: 200
    max_exponent: 8

episode:
  max_turns: 12
  tool_budget: 16

verifier:
  money_abs_usd: 0.01
  ratio_rel: 0.001
  ratio_abs: 0.000001
  pp_rel: 0.001
  pp_abs: 0.0001
