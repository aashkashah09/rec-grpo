[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recgrpo"
version = "0.1.0"
description = "Generative recommendation with semantic IDs, post-trained with GRPO on a verifiable cold-start reward"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "sentence-transformers>=2.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
baselines = ["recbole>=1.2.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
