[project]
name = "specialist-router"
version = "0.0.0"
description = "GRPO-trained SQL specialist behind an OPE-validated learned router (contextual-bandit cascade)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Specialist + Router" }]

# Phase 0: only lightweight, always-used runtime deps live here. Heavy ML deps
# (torch/trl/vllm/sentence-transformers) are deferred to the phase that needs them
# via the optional extras below, so CPU CI stays fast. See docs/decisions/000.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
# Deferred — NOT installed in Phase 0. Added/pinned in the phase that introduces them.
# Phase 2 (router featurizer, OPE reward model):
serving = [
  # "fastapi", "uvicorn", "httpx", "sentence-transformers", "scikit-learn"
]
# Phase 3 (GRPO specialist training — GPU only, never in CI):
training = [
  # "torch", "trl", "peft", "transformers", "vllm", "wandb", "datasets"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_router"]

# ----------------------------------------------------------------------------
# uv: dev tooling. `uv sync` installs project + dev group into .venv.
# ----------------------------------------------------------------------------
[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
]

# ----------------------------------------------------------------------------
# ruff: lint + format. Line length 100 per CLAUDE.md.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "D",   # pydocstyle (Google style, enforced below)
]
# D104: missing docstring in public package — we docstring every package, so keep on.
# Test files relax docstring requirements (see per-file-ignores).
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]        # tests need not carry Google-style docstrings on every function
"scripts/**" = ["D"]
# Concrete task templates inherit their per-method contract (and docstrings) from the
# TaskTemplate ABC; restating them on every override would violate "explain why, not restate".
"src/specialist_router/env/tasks.py" = ["D102"]

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------
# mypy: strict on src/ per CLAUDE.md.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# ----------------------------------------------------------------------------
# pytest: markers for gpu/external are declared and skipped-by-default in CI
# per CLAUDE.md (no test may call external APIs or require a GPU by default).
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires a GPU; skipped by default and in CI",
  "external: calls an external API; skipped by default and in CI",
]

[tool.coverage.run]
branch = true
source = ["src/specialist_router"]

[tool.coverage.report]
show_missing = true
