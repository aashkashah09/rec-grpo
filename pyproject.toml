[project]
name = "specialist-router"
version = "0.0.0"
description = "GRPO-trained SQL specialist behind an OPE-validated learned router (contextual-bandit cascade)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Specialist + Router" }]

# Phase 0: only lightweight, always-used runtime deps live here. Heavy ML deps
# (torch/trl/vllm/sentence-transformers) are deferred to the phase that needs them
# via the optional extras below, so CPU CI stays fast. See docs/decisions/000.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
# Phase 2 optional extras. NONE are installed in CI (`uv sync --frozen` installs the default +
# dev deps only): every CI-exercised path — hashing featurizer, numpy estimators, stub agents,
# the RouterService core — runs on numpy/pydantic/pyyaml alone. These extras back only the
# non-CI paths (the live FastAPI service, real HTTP agents, figures, the optional GBM/MiniLM
# variants). torch is deliberately kept out of the lock (deferred to Phase 3 training), so the
# real sentence-transformers embedding is a documented manual install, not a locked extra
# (see ADR-006).
serving = [        # live /solve service + real OpenAI-compatible agents
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]
analysis = [       # report tables + frontier / calibration figures
  "pandas>=2.0",
  "matplotlib>=3.8",
]
ml = [             # optional DR outcome-model variant (numpy ridge is the default)
  "scikit-learn>=1.4",
]
# Phase 3 (GRPO specialist training — GPU only, never installed in CI). Pins are intentionally
# loose here; the exact TRL/vLLM/transformers versions are locked on the GPU box when it is
# provisioned (TRL's agentic surface moves fast — re-verify GRPOConfig/rollout_func names then).
training = [
  "torch>=2.3",
  "trl>=1.0",
  "peft>=0.11",
  "transformers>=4.44",
  "vllm>=0.5",
  "bitsandbytes>=0.43",
  "accelerate>=0.30",
  "datasets>=2.19",
  "wandb>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_router"]

# ----------------------------------------------------------------------------
# uv: dev tooling. `uv sync` installs project + dev group into .venv.
# ----------------------------------------------------------------------------
[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
]

# ----------------------------------------------------------------------------
# ruff: lint + format. Line length 100 per CONVENTIONS.md.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "D",   # pydocstyle (Google style, enforced below)
]
# D104: missing docstring in public package — we docstring every package, so keep on.
# Test files relax docstring requirements (see per-file-ignores).
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]        # tests need not carry Google-style docstrings on every function
"scripts/**" = ["D"]
# Concrete task templates inherit their per-method contract (and docstrings) from the
# TaskTemplate ABC; restating them on every override would violate "explain why, not restate".
"src/specialist_router/env/tasks.py" = ["D102"]

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------
# mypy: strict on src/ per CONVENTIONS.md.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# Optional Phase-2 extras are NOT installed in the CI mypy environment (they are optional
# extras, not dev deps). These modules are imported lazily and only on the non-CI paths, so we
# let mypy treat them as untyped rather than fail `mypy src` when they are absent.
[[tool.mypy.overrides]]
module = [
  "fastapi.*",
  "httpx.*",
  "matplotlib.*",
  "sklearn.*",
  "sentence_transformers.*",
  # Phase-3 training extra (GPU only; never in the CI env). training/grpo_run.py and
  # training/sft_warmup.py import these lazily on the GPU path, so mypy treats them as untyped.
  "torch.*",
  "trl.*",
  "peft.*",
  "transformers.*",
  "vllm.*",
  "datasets.*",
  "wandb.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest: markers for gpu/external are declared and skipped-by-default in CI
# per CONVENTIONS.md (no test may call external APIs or require a GPU by default).
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires a GPU; skipped by default and in CI",
  "external: calls an external API; skipped by default and in CI",
  "training: requires the 'training' extra (torch/trl/…); skipped by default and in CI",
]

[tool.coverage.run]
branch = true
source = ["src/specialist_router"]

[tool.coverage.report]
show_missing = true
